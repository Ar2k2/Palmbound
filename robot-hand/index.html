<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Robot Hand</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0c14; }
      canvas { display: block; }
      #hud {
        position: fixed; top: 16px; left: 16px;
        font: 13px/1.6 monospace; color: #c9d1e0;
        background: rgba(8, 10, 18, 0.55); padding: 8px 12px; border-radius: 8px;
        border: 1px solid rgba(111, 168, 255, 0.25); backdrop-filter: blur(6px);
        white-space: pre; pointer-events: none;
      }
      #vignette {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(2, 3, 8, 0.65) 100%);
      }
      #message {
        position: fixed; top: 18%; left: 50%; transform: translateX(-50%);
        font: 18px/1.5 monospace; color: #6fe3ff; text-align: center;
        background: rgba(8, 10, 18, 0.72); padding: 12px 20px; border-radius: 8px;
        border: 1px solid rgba(111, 227, 255, 0.35); box-shadow: 0 0 24px rgba(111, 227, 255, 0.15);
        white-space: pre; pointer-events: none; opacity: 0; transition: opacity 0.6s;
      }
      #mini {
        position: fixed; top: 16px; right: 16px; width: 200px; height: 120px;
        border: 1px solid rgba(111, 168, 255, 0.35); background: #05060a; border-radius: 8px; opacity: 0.92;
      }
      #bossbar {
        position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); width: min(520px, 70vw); height: 12px;
        border: 1px solid rgba(255, 90, 90, 0.6); border-radius: 6px; background: rgba(20, 4, 6, 0.7); opacity: 0; transition: opacity 0.5s;
        pointer-events: none; box-shadow: 0 0 18px rgba(255, 60, 60, 0.3);
      }
      #bossbar::before { content: attr(data-name); position: absolute; top: -20px; left: 0; font: 12px monospace; color: #ff8a8a; letter-spacing: 2px; }
      #bossbar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff3a3a, #ff8a5a); border-radius: 5px; transition: width 0.25s; }
      #plating { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 6px; align-items: center; pointer-events: none; }
      #plating::before { content: 'PLATING'; font: 11px monospace; letter-spacing: 2px; color: #9aa6c4; margin-right: 6px; }
      #plating i {
        width: 22px; height: 26px; background: #ffd24a; opacity: 0.18; transition: opacity 0.2s, transform 0.2s;
        clip-path: polygon(0 0, 100% 0, 100% 55%, 50% 100%, 0 55%); filter: drop-shadow(0 0 4px #ffd24a);
      }
      #plating i.on { opacity: 1; }
      #cross { position: fixed; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 2px solid #ff7ae0; border-radius: 50%; display: none; pointer-events: none; box-shadow: 0 0 8px #ff5ad8; }
      #cross::after { content: ''; position: absolute; left: 8px; top: 8px; width: 4px; height: 4px; background: #ff7ae0; border-radius: 50%; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0a0c14; color: #6fa8ff; font: 16px monospace; letter-spacing: 3px; }
      #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.35s; }
      #bigmap {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(3, 4, 7, 0.93); flex-direction: column; font: 14px monospace; color: #c9d1e0;
      }
      #bigmap canvas { border: 1px solid #3a4058; image-rendering: pixelated; }
      #bigmap p { margin: 10px 0 0; color: #8a93ad; text-align: center; max-width: 90vw; }
    </style>
  </head>
  <body>
    <div id="loading">LOADING…</div>
    <div id="hud"></div>
    <div id="message"></div>
    <canvas id="mini" width="200" height="120"></canvas>
    <div id="bigmap"><canvas id="bigcanvas"></canvas><p id="mapinfo"></p></div>
    <div id="plating"></div>
    <div id="cross"></div>
    <div id="bossbar"><i></i></div>
    <div id="fade"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
